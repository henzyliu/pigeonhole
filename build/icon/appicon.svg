    <!-- Pigeon's iridescent neck -->
    <linearGradient id="neck" x1="586" y1="380" x2="640" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#A78BFA"/>
