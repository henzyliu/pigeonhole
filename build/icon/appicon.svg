    <linearGradient id="feathers" x1="0" y1="362" x2="0" y2="516" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3F5FA"/>
      <stop offset="1" stop-color="#D5DBE8"/>
