<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="150" y1="100" x2="874" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#6D4AEF"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="100" x2="512" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Cubby interiors: darker version of the tile, lighter towards the opening's bottom -->
    <linearGradient id="hole" x1="0" y1="272" x2="0" y2="752" gradientUnits="userSpaceOnUse">
