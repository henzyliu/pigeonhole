name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: build/bin/*.app
          - os: windows-latest
            platform: windows/amd64
            artifact: build/bin/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      # The SQLite driver uses cgo; the Windows runner ships MinGW gcc.
      # The commit, branch (or tag) and date show under Settings → About.
      - run: >
          wails build -clean -platform ${{ matrix.platform }} ${{ matrix.os == 'windows-latest' && '-nsis' || '' }}
          -ldflags "-X main.commit=${GITHUB_SHA::7} -X main.branch=${GITHUB_REF_NAME} -X main.buildDate=$(date -u +%Y-%m-%d)"
        shell: bash
        env:
          CGO_ENABLED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: pigeonhole-${{ runner.os }}
          path: ${{ matrix.artifact }}
